version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: ariranha-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoramento_zetta_incendios
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ariranha-ds:
    build: ./ariranha-ds
    container_name: ariranha-ds
    ports:
      - "5000:5000"
    restart: always

  ariranha-backend:
    build: ./ariranha-backend/ariranha 
    container_name: ariranha-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/monitoramento_zetta_incendios
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - ARIRANHA_JWT_SECRET=ChaveSecretaParaEntrarDoProjetoAriranhaQueMeuGrupoEstaDesenvolvendoComTodosDaEquipe

  # 4. A VITRINE (Frontend / React)
  ariranha-frontend:
    build: ./ariranha-frontend
    container_name: ariranha-frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - ariranha-backend

volumes:
  postgres_data: